<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RememberRemember promo tile</title>
  <style>
    html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
    body {
      display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 34px; box-sizing: border-box;
      background: #5b5bd6; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    .row { display: flex; align-items: center; gap: 14px; }
    img { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(255,255,255,.3); }
    h1 { margin: 0; font-size: 29px; letter-spacing: -.02em; }
    p { margin: 0; font-size: 17px; line-height: 1.4; opacity: .92; }
    mark { background: rgba(255, 212, 0, .9); color: #1d1d1f; padding: 0 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="row"><img src="../icons/icon128.png" alt=""><h1>RememberRemember</h1></div>
  <p>Highlight and annotate the web.<br><mark>Nothing leaves your browser.</mark></p>
</body>
</html>
