<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Margin workbench</title>
  <style>html, body { margin: 0; height: 100%; } iframe { width: 100%; height: 100%; border: 0; display: block; }</style>
</head>
<body>
  <!-- Opens an extension page (default: library) with the chrome.* stub injected. -->
  <iframe id="frame"></iframe>
  <script src="scenes.js"></script>
  <script src="mount.js"></script>
  <script>mountExtensionPage(document.getElementById('frame'), new URLSearchParams(location.search).get('page') || 'library.html');</script>
</body>
</html>
